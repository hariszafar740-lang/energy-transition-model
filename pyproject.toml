[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-transition-model"
version = "0.2.0"
description = "Single-bus representative-day capacity expansion and dispatch model (PyPSA + HiGHS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypsa>=1.4,<2",
    "highspy>=1.15",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "scipy>=1.11",
]

[tool.setuptools]
packages = ["energy_model"]

[tool.setuptools.package-data]
energy_model = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
