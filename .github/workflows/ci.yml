name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies (clean environment)
        run: |
          python -m pip install --upgrade pip "setuptools>=77.0" wheel
          python -m pip install --no-build-isolation -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Workbench artifact freshness (committed page == committed dataset)
        run: etm-workbench check

      - name: Test suite
        run: pytest -v

      - name: Model smoke test (CLI & plot render)
        run: |
          python main.py
          python main.py --duality-report --save-plot /tmp/etm_ci_smoke.png
          python main.py --dunkelflaute-report --save-storage-plot /tmp/etm_ci_storage.png
          python -c "from energy_model.workbench import plot_risk_frontier_and_kernel; \
            plot_risk_frontier_and_kernel('/tmp/etm_ci_risk.png')"
          test -s /tmp/etm_ci_risk.png
          rm -f /tmp/etm_ci_smoke.png /tmp/etm_ci_storage.png /tmp/etm_ci_risk.png

      - name: Build sdist and wheel
        run: |
          python -m build --no-isolation --sdist --wheel --outdir dist
          rm -rf dist build
